<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16324a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Leitor Bilíngue — PDF lado a lado</title>
  <style>
    :root { color-scheme: light; --ink:#142f43; --muted:#587080; --border:#d9e3e9; --blue:#12629d; --bg:#f0f5f8; --card:#fff; --focus:#cfe5f6; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); }
    #app { min-height:100dvh; height:100dvh; display:flex; flex-direction:column; }
    header { padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:var(--card); border-bottom:1px solid var(--border); }
    header h1 { margin:0 0 8px; font-size:17px; font-weight:750; letter-spacing:-.3px; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
    button, select, .file-label { appearance:none; border:1px solid #c4d6e0; border-radius:9px; padding:8px 10px; font-size:13px; color:var(--ink); background:#fff; line-height:1.2; }
    button { cursor:pointer; } button:focus-visible, select:focus-visible, .file-label:focus-within { outline:3px solid var(--focus); }
    button.primary, .file-label { background:var(--blue); border-color:var(--blue); color:white; font-weight:650; }
    input[type="file"] { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
    label.simple { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
    label.simple select { max-width:120px; }
    .pager { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--muted); }
    .pager input { width:65px; min-width:0; padding:8px; font:inherit; text-align:center; border:1px solid #c4d6e0; border-radius:9px; background:#fff; color:var(--ink); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .privacy { display:flex; align-items:flex-start; gap:8px; margin-top:8px; font-size:11px; line-height:1.45; color:var(--muted); }
    .privacy input { accent-color:var(--blue); margin-top:1px; }
    #status { min-height:25px; padding:5px 14px; font-size:11px; background:#e8f0f6; color:#34566a; border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    main { flex:1; display:grid; min-height:0; grid-template-rows:1fr 1fr; grid-template-columns: minmax(0,1fr); gap:7px; padding:7px 7px calc(env(safe-area-inset-bottom) + 7px); }
    .pane { display:flex; flex-direction:column; min-height:0; background:var(--card); border:1px solid var(--border); border-radius:11px; overflow:hidden; }
    .pane h2 { margin:0; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--border); background:#fafcfd; }
    .scroll { position:relative; flex:1; overflow:auto; min-height:0; padding:6px 13px 16px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
    .segment { margin:9px 0 13px; padding:2px 3px; font-size:15px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; border-radius:4px; }
    .segment.pending { color:#82929c; font-style:italic; }
    .segment.failed { color:#a23535; }
    .page-mark { margin:12px 0 8px; font-size:11px; font-weight:650; color:#5b8199; letter-spacing:.03em; }
    .empty { margin:28px 4px; text-align:center; color:#6c8090; font-size:14px; line-height:1.6; }
    .progress { color:#587080; font-size:12px; }
    footer { display:none; }
    @media (orientation:landscape) and (min-width:560px) { main { grid-template-rows:minmax(0,1fr); grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
    @media (min-width:960px) { main { grid-template-rows:minmax(0,1fr); grid-template-columns: minmax(0,1fr) minmax(0,1fr); padding:12px; gap:12px; } .scroll {padding:12px 20px;} .segment{font-size:16px;} }
    @media (max-height:450px) { header h1 {display:none;} .privacy {margin-top:4px;} .scroll {padding-top:0;} }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Leitor Bilíngue <span style="font-weight:400;color:#648093">· v2 com OCR</span></h1>
      <div class="toolbar">
        <label class="file-label" for="pdfFile">Abrir PDF <input id="pdfFile" type="file" accept="application/pdf,.pdf"></label>
        <button id="sample" type="button">Exemplo</button>
        <label class="simple" for="source">De <select id="source" aria-label="Idioma original">
          <option value="es" selected>Espanhol</option><option value="en">Inglês</option><option value="fr">Francês</option><option value="de">Alemão</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ja">Japonês</option><option value="zh-CN">Chinês</option><option value="ru">Russo</option><option value="ar">Árabe</option>
        </select></label>
        <label class="simple" for="target">Para <select id="target" aria-label="Idioma da tradução">
          <option value="pt" selected>Português</option><option value="es">Espanhol</option><option value="en">Inglês</option><option value="fr">Francês</option><option value="de">Alemão</option><option value="it">Italiano</option><option value="ja">Japonês</option><option value="zh-CN">Chinês</option><option value="ru">Russo</option>
        </select></label>
      </div>
      <div class="pager" aria-label="Navegação por páginas">
        <label for="pageInput">Página</label><input id="pageInput" type="number" min="1" value="1" disabled><span id="pageTotal">de 0</span>
        <button type="button" id="jumpPage" disabled>Ir</button>
        <button type="button" id="nextPage" disabled>Próxima página</button>
      </div>
      <label class="privacy"><input id="consent" type="checkbox"><span>Autorizo enviar pequenos trechos do PDF ao serviço externo MyMemory para tradução. Não envie documentos sigilosos.</span></label>
    </header>
    <div id="status" role="status" aria-live="polite">Abra um PDF ou toque em Exemplo. O OCR funciona no aparelho; a tradução exige autorização.</div>
    <main>
      <section class="pane"><h2>Original</h2><div id="original" class="scroll" aria-label="Texto original"><p class="empty">Seu texto original aparecerá aqui.</p></div></section>
      <section class="pane"><h2>Tradução</h2><div id="translation" class="scroll" aria-label="Texto traduzido"><p class="empty">A tradução surgirá aqui, parágrafo por parágrafo.</p></div></section>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <script defer src="app.js?v=2"></script>
</body>
</html>
