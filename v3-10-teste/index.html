<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16324a"><title>Leitor Bilíngue — V3.10 teste</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#153247;background:#eff4f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}#app{height:100dvh;display:flex;flex-direction:column}header{padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:white;border-bottom:1px solid #dce4ea}h1{font-size:18px;margin:0 0 3px}.app-credit{flex:none;text-align:center;font-size:11px;font-weight:500;color:#607786;padding:7px 12px calc(env(safe-area-inset-bottom) + 7px);background:#fff;border-top:1px solid #dce4ea}h1 small{font-size:12px;color:#526e7d;font-weight:500}.desc{font-size:12px;color:#536e7d;margin:0 0 10px}.toolbar,.pager,.testrow{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.pager,.testrow{margin-top:9px}button,.upload,select,input[type=number]{border:1px solid #c2d5e0;background:white;border-radius:9px;padding:9px 11px;color:#143146;font-size:13px}.primary,.upload{background:#14669e;color:white;font-weight:650;border-color:#14669e}.upload{display:inline-block;cursor:pointer}input[type=file]{display:none}input[type=number]{width:72px}button:disabled{opacity:.5}.tag{font-size:11px;background:#eef5fb;border:1px solid #d5e6f1;border-radius:20px;padding:5px 8px;color:#346481}#status{font-size:12px;background:#e7f1f7;color:#27536e;border-bottom:1px solid #d5e5ef;padding:9px 14px;min-height:35px}#teststatus{font-size:12px;color:#536c7a}.testrow:has(#teststatus:empty){display:none}.panes{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:8px;padding:8px}.panes.mode-stacked{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}.view-switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#34576c;white-space:nowrap}.view-switch select{max-width:155px;padding:8px 9px}.pane{background:white;min-width:0;min-height:0;border:1px solid #d9e4eb;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.pane h2{font-size:12px;letter-spacing:.03em;text-transform:uppercase;padding:10px 12px;margin:0;border-bottom:1px solid #e6edf0;color:#426174}.text{flex:1;overflow:auto;position:relative;overflow-anchor:none;padding:13px 12px 25px;overscroll-behavior:contain;scroll-behavior:auto}.text p{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 17px}.text p.pending{color:#80909c;font-style:italic}.text p.failed{color:#9d402c}.page-block{padding-bottom:10px;min-height:1px}.page-block+.page-block{border-top:1px solid #bfd2df;margin-top:14px;padding-top:8px}.mark{font-size:11px;font-weight:700;letter-spacing:.08em;color:#426a82;border-top:1px solid #dfe7ec;padding:10px 0;margin:8px 0 13px}.empty{font-style:italic;color:#6b8392}@media(max-width:600px){h1{font-size:16px}.panes{gap:5px;padding:5px}.pane h2{padding:8px;font-size:11px}.text{padding:10px 8px}.text p{font-size:12px;line-height:1.52}.toolbar button,.toolbar select{padding:7px 8px;font-size:12px}}a{color:#13669f}

.ocr-options{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#34576c}
.ocr-options select{max-width:135px;padding:8px 7px}
#reviewOcr,#figureButton,#retranslatePage{font-size:12px}
.figure-dialog[hidden]{display:none!important}
.figure-dialog{position:fixed;inset:0;z-index:30;background:rgba(9,27,39,.72);display:flex;justify-content:center;align-items:center;padding:12px}
.figure-box{width:min(100%,730px);max-height:97dvh;overflow:auto;background:white;border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px}
.figure-box h2{font-size:16px;margin:0}.figure-box p{font-size:12px;color:#536e7d;margin:0}
#figureCanvas{display:block;width:auto;max-width:100%;max-height:65dvh;object-fit:contain;touch-action:none;user-select:none;align-self:center;border:1px solid #d9e4eb;cursor:crosshair}
.figure-actions{display:flex;justify-content:flex-end;gap:8px}
</style></head><body><div id="app">
<header><h1>Leitor Bilíngue</h1>
<div class="toolbar"><label class="upload">Abrir PDF <input id="pdfFile" type="file" accept="application/pdf,.pdf"></label><button id="testEngine">Testar tradutor</button><button id="reviewOcr" type="button" disabled title="Refaz o reconhecimento da página selecionada">Revisar OCR</button><button id="retranslatePage" type="button" disabled title="Refaz apenas a tradução da página atual em trechos menores">Revisar tradução</button><label class="ocr-options" for="ocrMode">Modo OCR <select id="ocrMode" aria-label="Modo de revisão do texto"><option value="auto">Automático</option><option value="regions">Por regiões</option><option value="precision">Alta precisão</option></select></label><button id="figureButton" type="button" disabled title="Marque uma imagem que está confundindo o reconhecimento do texto">Marcar figura</button><label class="view-switch" for="viewMode">Visualização <select id="viewMode" aria-label="Modo de visualização"><option value="side">Lado a lado</option><option value="stacked">Em cima/embaixo</option></select></label></div>
<div class="pager"><button id="prev" disabled>← Anterior</button><span>Página</span><input id="pageNum" type="number" min="1" value="1" disabled><span id="total">de 0</span><button id="go" disabled>Ir</button><button id="next" disabled>Próxima →</button></div>
<div class="testrow"><span id="teststatus"></span></div>
</header>
<div role="status" id="status">Escolha um PDF ou teste primeiro a tradução.</div>
<main id="panes" class="panes"><section class="pane"><h2>Original · Espanhol</h2><div id="original" class="text"><p class="empty">O texto do PDF aparecerá aqui.</p></div></section><section class="pane"><h2>Tradução · Português</h2><div id="translation" class="text"><p class="empty">A tradução aparecerá aqui.</p></div></section></main>
<footer class="app-credit">por Lucas Rafael</footer>
<div id="figureDialog" class="figure-dialog" hidden role="dialog" aria-modal="true" aria-label="Marcar figura da página"><div class="figure-box"><h2>Marcar figura para ignorar no OCR</h2><p id="figureHint">Arraste o dedo ou mouse ao redor da figura.</p><canvas id="figureCanvas" aria-label="Prévia da página para selecionar uma figura"></canvas><div class="figure-actions"><button id="cancelFigure" type="button">Cancelar</button><button id="applyFigure" type="button" class="primary">Aplicar revisão</button></div></div></div>
</div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
